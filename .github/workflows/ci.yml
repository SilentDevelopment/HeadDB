name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-core:
    name: API/Core · Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify API and core
        run: ./mvnw -B -ntp -pl headdb-api,headdb-core -am verify

  paper:
    name: Paper plugin · Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="$(.github/scripts/project-version.sh)"
          short_sha="${GITHUB_SHA::7}"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          build_id="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          artifact_name="HeadDB-${version}+ci.${build_id}.${short_sha}"
          jar_name="${artifact_name}.jar"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "jar_name=${jar_name}" >> "$GITHUB_OUTPUT"

      - name: Verify and package Paper plugin
        run: |
          ./mvnw -B -ntp -pl headdb-platforms/headdb-paper -am verify \
            -Dheaddb.build.channel=ci \
            -Dheaddb.build.number="${{ github.run_number }}" \
            -Dheaddb.build.attempt="${{ github.run_attempt }}" \
            -Dheaddb.build.run-id="${{ github.run_id }}" \
            -Dheaddb.build.commit="${{ github.sha }}" \
            -Dheaddb.build.branch="${{ steps.meta.outputs.branch }}" \
            -Dheaddb.build.timestamp="${{ steps.meta.outputs.timestamp }}"

      - name: Inspect packaged plugin
        run: |
          .github/scripts/inspect-plugin.sh \
            headdb-platforms/headdb-paper/target/HeadDB.jar \
            "${{ steps.meta.outputs.version }}" \
            ci \
            "${{ github.run_number }}" \
            "${{ github.run_attempt }}" \
            "${{ github.run_id }}" \
            "${{ github.sha }}"

      - name: Prepare CI artifact
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          JAR_NAME: ${{ steps.meta.outputs.jar_name }}
        run: |
          set -euo pipefail

          mkdir -p build/ci-artifact
          cp headdb-platforms/headdb-paper/target/HeadDB.jar "build/ci-artifact/${JAR_NAME}"

          (
            cd build/ci-artifact
            sha256sum "${JAR_NAME}" > "${JAR_NAME}.sha256"
          )

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "project": "HeadDB",
              "pluginVersion": os.environ["VERSION"],
              "channel": "ci",
              "buildNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "buildAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "commit": os.environ["GITHUB_SHA"],
              "shortCommit": os.environ["SHORT_SHA"],
              "branch": os.environ["BRANCH"],
              "ref": os.environ["GITHUB_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "timestamp": os.environ["TIMESTAMP"],
              "artifactFile": os.environ["JAR_NAME"],
              "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }

          Path("build/ci-artifact/build.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: build/ci-artifact/
          if-no-files-found: error
          retention-days: 30

  licenses:
    name: License layout
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify license files
        run: .github/scripts/check-licenses.sh

  pr-title:
    name: Conventional PR title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          pattern='^(feat|fix|perf|refactor|docs|build|ci|test|chore|revert|style)(\([a-zA-Z0-9._/-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must use Conventional Commits, for example: feat: add category drafts" >&2
            exit 1
          fi

  required:
    name: Required
    if: always()
    needs:
      - api-core
      - paper
      - licenses
      - pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          API_CORE_RESULT: ${{ needs.api-core.result }}
          PAPER_RESULT: ${{ needs.paper.result }}
          LICENSES_RESULT: ${{ needs.licenses.result }}
          PR_TITLE_RESULT: ${{ needs.pr-title.result }}
        run: |
          set -euo pipefail

          test "$API_CORE_RESULT" = success
          test "$PAPER_RESULT" = success
          test "$LICENSES_RESULT" = success

          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$PR_TITLE_RESULT" = success
          else
            test "$PR_TITLE_RESULT" = skipped
          fi
