name: Release

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing clean SemVer tag to publish or recover
        required: true
        type: string
      publish_modrinth:
        description: Publish the release artifact to Modrinth
        required: true
        default: true
        type: boolean
      publish_hangar:
        description: Publish the release artifact to Hangar
        required: true
        default: true
        type: boolean
      publish_github:
        description: Publish the draft GitHub Release after selected destinations succeed
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release_pr:
    name: Prepare release PR
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Prepare release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  prepare_release:
    name: Prepare immutable release artifact
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      jar_name: ${{ steps.meta.outputs.jar_name }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      body: ${{ steps.notes.outputs.body }}
      modrinth_channel: ${{ steps.meta.outputs.modrinth_channel }}
      hangar_channel: ${{ steps.meta.outputs.hangar_channel }}
      publish_modrinth: ${{ steps.meta.outputs.publish_modrinth }}
      publish_hangar: ${{ steps.meta.outputs.publish_hangar }}
      publish_github: ${{ steps.meta.outputs.publish_github }}

    steps:
      - name: Resolve requested tag
        id: requested
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ -z "$tag" ]]; then
            echo "A release tag is required." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout released tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.requested.outputs.tag }}
          fetch-depth: 0

      - name: Resolve and validate release metadata
        id: meta
        env:
          REQUESTED_TAG: ${{ steps.requested.outputs.tag }}
          DISPATCH_MODRINTH: ${{ inputs.publish_modrinth }}
          DISPATCH_HANGAR: ${{ inputs.publish_hangar }}
          DISPATCH_GITHUB: ${{ inputs.publish_github }}
        run: |
          set -euo pipefail

          version="$(.github/scripts/project-version.sh)"
          .github/scripts/validate-version.sh "$REQUESTED_TAG" "$version"

          commit="$(git rev-parse HEAD)"
          commit_timestamp="$(git show -s --format=%cI HEAD)"
          timestamp="$(date -u -d "$commit_timestamp" +'%Y-%m-%dT%H:%M:%SZ')"

          prerelease_id=""
          modrinth_channel=release
          hangar_channel=Release

          if [[ "$version" == *-* ]]; then
            prerelease_id="${version#*-}"

            case "$prerelease_id" in
              alpha|alpha.*)
                modrinth_channel=alpha
                hangar_channel=Alpha
                ;;
              beta|beta.*|rc|rc.*)
                modrinth_channel=beta
                hangar_channel=Beta
                ;;
              *)
                echo "Unsupported public prerelease identifier: ${prerelease_id}" >&2
                exit 1
                ;;
            esac
          fi

          publish_modrinth=true
          publish_hangar=true
          publish_github=true

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            publish_modrinth="$DISPATCH_MODRINTH"
            publish_hangar="$DISPATCH_HANGAR"
            publish_github="$DISPATCH_GITHUB"
          fi

          artifact_name="release-${version}"
          jar_name="HeadDB-${version}.jar"

          echo "tag=${REQUESTED_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "jar_name=${jar_name}" >> "$GITHUB_OUTPUT"
          echo "modrinth_channel=${modrinth_channel}" >> "$GITHUB_OUTPUT"
          echo "hangar_channel=${hangar_channel}" >> "$GITHUB_OUTPUT"
          echo "publish_modrinth=${publish_modrinth}" >> "$GITHUB_OUTPUT"
          echo "publish_hangar=${publish_hangar}" >> "$GITHUB_OUTPUT"
          echo "publish_github=${publish_github}" >> "$GITHUB_OUTPUT"

      - name: Wait for draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "GitHub Release does not exist for tag ${RELEASE_TAG}." >&2
              exit 1
            fi

            sleep 5
          done

      - name: Read release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > release-notes.md
          delimiter="RELEASE_NOTES_$(date +%s)_${RANDOM}"

          {
            echo "body<<${delimiter}"
            cat release-notes.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Reuse existing release assets when available
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          JAR_NAME: ${{ steps.meta.outputs.jar_name }}
        run: |
          set -euo pipefail

          mkdir -p dist
          rm -f "dist/${JAR_NAME}" "dist/${JAR_NAME}.sha256"

          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$JAR_NAME" --pattern "${JAR_NAME}.sha256" --dir dist >/dev/null 2>&1 && (
            cd dist
            sha256sum --check "${JAR_NAME}.sha256"
          ); then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "Reusing the existing verified release assets."
            exit 0
          fi

          rm -f "dist/${JAR_NAME}" "dist/${JAR_NAME}.sha256"
          echo "reused=false" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        if: ${{ steps.existing.outputs.reused != 'true' }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and package release
        if: ${{ steps.existing.outputs.reused != 'true' }}
        run: |
          ./mvnw -B -ntp clean verify \
            -Dproject.build.outputTimestamp="${{ steps.meta.outputs.timestamp }}" \
            -Dheaddb.build.channel=release \
            -Dheaddb.build.number="${{ github.run_number }}" \
            -Dheaddb.build.attempt="${{ github.run_attempt }}" \
            -Dheaddb.build.run-id="${{ github.run_id }}" \
            -Dheaddb.build.commit="${{ steps.meta.outputs.commit }}" \
            -Dheaddb.build.branch=master \
            -Dheaddb.build.timestamp="${{ steps.meta.outputs.timestamp }}"

      - name: Inspect packaged plugin
        if: ${{ steps.existing.outputs.reused != 'true' }}
        run: |
          .github/scripts/inspect-plugin.sh \
            headdb-platforms/headdb-paper/target/HeadDB.jar \
            "${{ steps.meta.outputs.version }}" \
            release \
            "${{ github.run_number }}" \
            "${{ github.run_attempt }}" \
            "${{ github.run_id }}" \
            "${{ steps.meta.outputs.commit }}"

      - name: Prepare new release assets
        if: ${{ steps.existing.outputs.reused != 'true' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          JAR_NAME: ${{ steps.meta.outputs.jar_name }}
        run: |
          set -euo pipefail

          cp headdb-platforms/headdb-paper/target/HeadDB.jar "dist/${JAR_NAME}"

          (
            cd dist
            sha256sum "${JAR_NAME}" > "${JAR_NAME}.sha256"
          )

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "project": "HeadDB",
              "pluginVersion": os.environ["VERSION"],
              "channel": "release",
              "tag": os.environ["TAG"],
              "buildNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "buildAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "commit": os.environ["COMMIT"],
              "branch": "master",
              "timestamp": os.environ["TIMESTAMP"],
              "artifactFile": os.environ["JAR_NAME"],
              "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }

          Path("dist/build.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Prepare metadata for reused assets
        if: ${{ steps.existing.outputs.reused == 'true' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          JAR_NAME: ${{ steps.meta.outputs.jar_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "project": "HeadDB",
              "pluginVersion": os.environ["VERSION"],
              "channel": "release",
              "tag": os.environ["TAG"],
              "commit": os.environ["COMMIT"],
              "branch": "master",
              "timestamp": os.environ["TIMESTAMP"],
              "artifactFile": os.environ["JAR_NAME"],
              "reusedFromGitHubRelease": True,
          }

          Path("dist/build.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Attest new release JAR
        if: ${{ steps.existing.outputs.reused != 'true' }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/${{ steps.meta.outputs.jar_name }}

      - name: Attach new assets to draft GitHub Release
        if: ${{ steps.existing.outputs.reused != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish_modrinth:
    name: Publish to Modrinth
    if: ${{ needs.prepare_release.outputs.publish_modrinth == 'true' }}
    needs:
      - prepare_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download immutable release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.prepare_release.outputs.artifact_name }}
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT_NAME" --dir dist --repo "$GITHUB_REPOSITORY"

      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check "${{ needs.prepare_release.outputs.jar_name }}.sha256"

      - name: Publish version
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          version: ${{ needs.prepare_release.outputs.version }}
          name: ${{ needs.prepare_release.outputs.version }}
          channel: ${{ needs.prepare_release.outputs.modrinth_channel }}
          changelog: ${{ needs.prepare_release.outputs.body }}
          loaders: |-
            paper
            folia
          game-versions: |-
            26.1.x
            26.2.x
          files: dist/${{ needs.prepare_release.outputs.jar_name }}

  publish_hangar:
    name: Publish to Hangar
    if: ${{ needs.prepare_release.outputs.publish_hangar == 'true' }}
    needs:
      - prepare_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download immutable release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.prepare_release.outputs.artifact_name }}
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT_NAME" --dir dist --repo "$GITHUB_REPOSITORY"

      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check "${{ needs.prepare_release.outputs.jar_name }}.sha256"

      - name: Publish version
        uses: benwoo1110/hangar-upload-action@v1
        with:
          api_token: ${{ secrets.HANGAR_TOKEN }}
          slug: ${{ vars.HANGAR_PROJECT_SLUG }}
          version: ${{ needs.prepare_release.outputs.version }}
          channel: ${{ needs.prepare_release.outputs.hangar_channel }}
          description: ${{ needs.prepare_release.outputs.body }}
          files: |-
            [
              {
                "path": "dist/${{ needs.prepare_release.outputs.jar_name }}",
                "platforms": ["PAPER"]
              }
            ]
          platform_dependencies: |-
            {
              "PAPER": ["26.1.x", "26.2.x"]
            }

  publish_github:
    name: Publish GitHub Release
    if: >-
      ${{
        always() &&
        needs.prepare_release.result == 'success' &&
        needs.prepare_release.outputs.publish_github == 'true' &&
        (
          needs.prepare_release.outputs.publish_modrinth != 'true' ||
          needs.publish_modrinth.result == 'success'
        ) &&
        (
          needs.prepare_release.outputs.publish_hangar != 'true' ||
          needs.publish_hangar.result == 'success'
        )
      }}
    needs:
      - prepare_release
      - publish_modrinth
      - publish_hangar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Publish completed draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
